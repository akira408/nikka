// 起動
// ============================================================
const demoKey = () => `date=${params.get('date') || ''}&time=${params.get('time') || ''}`;

function seedDemo() {
  const dateP = params.get('date'), timeP = params.get('time') || '';
  const realNow = Date.now(), p = jstParts(realNow);
  let hh = p.h, mm = p.mi;
  const t = timeP.match(/^(\d{1,2}):(\d{2})$/);
  if (t && +t[1] < 24 && +t[2] < 60) { hh = +t[1]; mm = +t[2]; }
  const day = isDate(dateP) ? dateP : logicalDate(realNow, 0);
  const target = isDate(dateP) || t ? msAt(day, hh, mm, 0) : realNow;
  clock.offset = target - realNow;
  data = buildDemo(logicalDate(target, 0));
  demo = { key: demoKey(), offset: clock.offset };
  save();
}

function boot() {
  if (MODE === 'demo') {
    const saved = loadKey('todo-v1-demo');
    if (saved && saved.data && saved.demo && saved.demo.key === demoKey()) {
      data = saved.data;
      demo = saved.demo;
      clock.offset = demo.offset;
    } else {
      seedDemo();
    }
  } else {
    // 前回ログインしていたら、その写しからすぐに表示する(Firebaseの準備を待たない)
    const uid = Sync.enabled ? localStorage.getItem(UID_KEY) : null;
    const cached = uid ? loadKey(cacheKey(uid)) : null;
    const saved = loadKey(PREFIX);
    if (cached && cached.data && cached.data.v === 1) {
      Sync.uidHint = uid;
      data = cached.data;
    } else if (saved && saved.data && saved.data.v === 1) {
      data = saved.data;
    } else {
      data = freshData(logicalDate(Date.now(), 0));
      save();
    }
  }
  if (MODE !== 'demo') Calendar.load();
  refreshDay();
  render();
  setInterval(tick, 15000);
  // カレンダーは、開いたときと1時間ごと(画面に戻ってきたときも、10分以上たっていれば)に読み込む
  fetchCalendar();
  setInterval(() => fetchCalendar(), HOUR);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    tick();
    if (!Calendar.status || Date.now() - Calendar.status.at > 10 * 60000) fetchCalendar();
  });
  window.addEventListener('online', () => { updateStatus(); maybeFinalize(); });
  window.addEventListener('offline', updateStatus);
  document.getElementById('dialog').addEventListener('close', flushRender);
  document.addEventListener('focusout', flushRender);
  if (Sync.enabled) startSync();
}

// ============================================================
// 動作確認(?test)— ストリークの判定を、ルール1〜5と表の例で確かめます
// ============================================================
function runTests() {
  const results = [];
  const check = (name, ok, detail = '') => results.push({ name, ok: !!ok, detail: String(detail ?? '') });
  const MWF = (ds, day) => !!(day && day.gymManual) || demoGym(ds);

  // 日付と時刻
  check('日本時間:世界標準時 10/18 15:00 は 10/19 0:00', logicalDate(Date.UTC(2026, 9, 18, 15, 0), 0) === '2026-10-19');
  check('日本時間:世界標準時 10/18 14:59 は 10/18 23:59', logicalDate(Date.UTC(2026, 9, 18, 14, 59), 0) === '2026-10-18');
  check('区切り3:00のとき、10/20 2:30 は 10/19 の分', logicalDate(msAt('2026-10-19', 2, 30, 3), 3) === '2026-10-19' && jstParts(msAt('2026-10-19', 2, 30, 3)).d === 20);
  check('区切り3:00のとき、10/20 3:00 からは 10/20 の分', logicalDate(Date.UTC(2026, 9, 19, 18, 0), 3) === '2026-10-20');
  check('10/31 の次の日は 11/1', addDays('2026-10-31', 1) === '2026-11-01');
  check('10/18 から IELTS本番(11/7)まで あと20日', diffDays('2026-10-18', '2026-11-07') === 20);
  check('11/5 は 11/6 0:00(日本時間)に終わる', dayEndMs('2026-11-05', 0) === Date.UTC(2026, 10, 5, 15, 0));
  check('区切りを遅らせても、確定済みの日には戻らない', effectiveToday(Date.UTC(2026, 9, 18, 16, 0), 3, '2026-10-18') === '2026-10-19');

  // ルール1〜5
  const base = { taskIds: ['a', 'b'], checks: {}, rest: false, streak: 5, freezeLeft: 2 };
  let j = judgeDay({ ...base, checks: { a: true, b: true } });
  check('ルール1:全部完了 →「完了」', j.result === 'done' && !j.freezeUsed);
  j = judgeDay({ ...base, rest: true, checks: { a: true } });
  check('ルール2:「今日は休む」を使って未完了 →「フリーズ」', j.result === 'freeze' && j.freezeUsed && j.by === 'rest');
  j = judgeDay({ ...base, checks: { a: true } });
  check('ルール3:未完了でフリーズが残っている → 自動で「フリーズ」', j.result === 'freeze' && j.freezeUsed && j.by === 'auto');
  j = judgeDay({ ...base, freezeLeft: 0 });
  check('ルール4:未完了でフリーズが残っていない →「途切れ」', j.result === 'broken' && !j.freezeUsed);
  j = judgeDay({ ...base, taskIds: [] });
  check('ルール5:やるべき日課が0個 →「お休み」', j.result === 'off' && !j.freezeUsed);
  j = judgeDay({ ...base, rest: true, checks: { a: true, b: true } });
  check('休んだ日でも全部終えれば「完了」(フリーズは使わない)', j.result === 'done' && !j.freezeUsed);
  j = judgeDay({ ...base, streak: 0 });
  check('連続0日の日に未完了 → フリーズは使わない', j.result === 'broken' && !j.freezeUsed);
  j = judgeDay({ ...base, taskIds: [], rest: true });
  check('日課0個の日に休んでも、フリーズは使わない', j.result === 'off' && !j.freezeUsed);

  // 表の例は、最初の4つの日課(単語帳・スピーキング・食事・ジム)で確かめる
  const base4 = d => {
    for (const id of Object.keys(d.habits)) if (!['h-vocab', 'h-speak', 'h-meal', 'h-gym'].includes(id)) delete d.habits[id];
    return d;
  };
  const off = base4(freshData('2026-10-18'));
  Object.values(off.habits).forEach(h => (h.end = '2026-10-18'));
  off.days['2026-10-18'] = { ...newDay('2026-10-18'), checks: { 'h-vocab': true, 'h-speak': true, 'h-meal': true } };
  finalizeThrough(off, '2026-10-19', () => false);
  check('お休みの日は、連続日数がそのまま(増えない)', off.days['2026-10-19'].result === 'off' && off.state.streak === 1, `連続${off.state.streak}日`);

  // 設計案の表(10/18〜11/5)
  const sim = base4(freshData('2026-10-18'));
  const all = ds => {
    const day = (sim.days[ds] ||= newDay(ds));
    tasksFor(ds, Object.values(sim.habits), MWF(ds, day)).forEach(h => (day.checks[h.id] = true));
  };
  const open = ds => finalizeThrough(sim, addDays(ds, -1), MWF); // その日にサイトを開く
  const leftAt = ds => sim.settings.freezePerMonth - Object.values(sim.days)
    .filter(x => x.result && monthOf(x.date) === monthOf(ds) && x.date <= ds && x.freezeUsed).length;
  const row = (ds, result, streak, left, extra = true) => {
    const x = sim.days[ds];
    check(`表 ${md(ds)}:${RESULT_LABEL[result]}・連続${streak}日・フリーズ残り${left}回`,
      x && x.result === result && x.streakAfter === streak && leftAt(ds) === left && extra,
      x ? `結果:${RESULT_LABEL[x.result] || '未確定'}・連続${x.streakAfter}日・残り${leftAt(ds)}回` : '記録なし');
  };
  all('2026-10-18'); open('2026-10-19');
  row('2026-10-18', 'done', 1, 2);
  all('2026-10-19'); open('2026-10-20');
  row('2026-10-19', 'done', 2, 2, sim.days['2026-10-19'].tasks.length === 4);
  (sim.days['2026-10-20'] = newDay('2026-10-20')).rest = true;
  check('10/20(火)「今日は休む」を押すと、今月の残りがすぐ1回になる', todayInfo(sim, '2026-10-20', MWF).left === 1);
  open('2026-10-21');
  row('2026-10-20', 'freeze', 2, 1, sim.days['2026-10-20'].freezeBy === 'rest');
  (sim.days['2026-10-21'] = newDay('2026-10-21')).rest = true;
  check('10/21(水)「今日は休む」を押すと残り0回', todayInfo(sim, '2026-10-21', MWF).left === 0);
  all('2026-10-21');
  const i21 = todayInfo(sim, '2026-10-21', MWF);
  check('10/21(水) 全部終えるとフリーズが戻り、連続3日と表示', i21.left === 1 && i21.streakShown === 3, `残り${i21.left}回・連続${i21.streakShown}日`);
  open('2026-10-22');
  row('2026-10-21', 'done', 3, 1);
  for (let ds = '2026-10-22'; ds <= '2026-10-29'; ds = addDays(ds, 1)) { all(ds); open(addDays(ds, 1)); }
  all('2026-10-30');
  open('2026-11-04'); // 10/31〜11/3は開かず、11/4に開く
  row('2026-10-30', 'done', 12, 1);
  row('2026-10-31', 'freeze', 12, 0, sim.days['2026-10-31'].freezeBy === 'auto');
  row('2026-11-01', 'freeze', 12, 1);
  row('2026-11-02', 'freeze', 12, 0, sim.days['2026-11-02'].tasks.length === 4);
  row('2026-11-03', 'broken', 0, 0);
  const bn = sim.state.brokenNotice;
  check('11/4 に開くと「ストリークが途切れました(最高記録:12日)」', bn && bn.lost === 12 && bn.best === 12, JSON.stringify(bn));
  check('最高記録は12日のまま残る', sim.state.best === 12, `${sim.state.best}日`);
  all('2026-11-04'); open('2026-11-05');
  row('2026-11-04', 'done', 1, 0);
  const i5 = todayInfo(sim, '2026-11-05', MWF);
  const w15 = warningFor(i5, msAt('2026-11-05', 15, 0, 0), 0);
  check('11/5 15:00「フリーズなし:今日やらないと0日に戻ります」が出る', w15 && w15.noFreeze && !w15.urgent);
  const w2048 = warningFor(i5, msAt('2026-11-05', 20, 48, 0), 0);
  check('11/5 20:48「あと3時間12分でストリークが消えます」', w2048 && w2048.urgent && w2048.text === 'あと3時間12分でストリークが消えます', w2048 && w2048.text);
  const w21 = warningFor({ ...i5, left: 1 }, msAt('2026-11-05', 21, 0, 0), 0);
  check('フリーズが残っている日は「このままだとフリーズを1回使います」', w21 && w21.text === 'あと3時間(このままだとフリーズを1回使います)', w21 && w21.text);
  sim.habits['h-vocab'].name = '名前を変えた';
  delete sim.habits['h-speak'];
  check('日課を編集・削除しても、確定した日の記録は変わらない',
    sim.days['2026-10-18'].tasks.map(t => t.name).join('・') === '単語帳を読む・スピーキング1回・食事・プロテイン');

  // 記録(段階3)— 表の例のデータを使う
  const oct = monthStats(sim, '2026-10', '2026-11-05', false);
  check('10月の達成率:日課があった14日のうち完了12日 → 86%', oct.done === 12 && oct.total === 14 && oct.rate === 86, JSON.stringify(oct));
  const nov = monthStats(sim, '2026-11', '2026-11-05', false);
  check('11月の達成率:今日がまだなら今日は数えない(1/4 → 25%)', nov.done === 1 && nov.total === 4 && nov.rate === 25, JSON.stringify(nov));
  const novDone = monthStats(sim, '2026-11', '2026-11-05', true);
  check('今日を全部終えたら、今日も数える(2/5 → 40%)', novDone.rate === 40, JSON.stringify(novDone));
  check('お休みの日は達成率に数えない', monthStats(off, '2026-10', '2026-10-20', false).total === 1);
  check('カレンダーの色:フリーズ・途切れ・今日・使い始める前・これから先',
    dayStatus(sim, '2026-10-20', '2026-11-05', false) === 'freeze' && dayStatus(sim, '2026-11-03', '2026-11-05', false) === 'broken'
      && dayStatus(sim, '2026-11-05', '2026-11-05', false) === 'today' && dayStatus(sim, '2026-10-17', '2026-11-05', false) === 'none'
      && dayStatus(sim, '2026-11-06', '2026-11-05', false) === 'none');
  const grid = monthGrid('2026-10');
  check('2026年10月のカレンダーは木曜から始まる5週', grid.slice(0, 4).every(x => x === null) && grid[4] === '2026-10-01' && grid.length === 35);
  check('前の月・次の月(年をまたぐ)', addMonth('2026-01', -1) === '2025-12' && addMonth('2026-12', 1) === '2027-01');

  // カレンダー連携(段階5)
  Calendar.dates = new Set(['2026-10-19']);
  check('カレンダーにジムの予定がある日は、ジムの日', gymOf('2026-10-19', null) && !gymOf('2026-10-20', null));
  check('その日の記録に残した結果(ほかの端末が読んだ分)を優先する', gymOf('2026-10-20', { gymCal: true }) && !gymOf('2026-10-19', { gymCal: false }));
  check('「今日はジムの日にする」はカレンダーより優先', gymOf('2026-10-20', { gymManual: true, gymCal: false }));
  Calendar.dates = new Set();

  // 目標のステップ(段階2)
  const st = [
    { id: 'a', title: 'A', due: '2026-10-25', done: false, order: 3 },
    { id: 'b', title: 'B', due: '2026-10-20', done: false, order: 4 },
    { id: 'c', title: 'C', due: null, done: false, order: 1 },
    { id: 'd', title: 'D', due: '2026-10-25', done: false, order: 2 },
    { id: 'e', title: 'E', due: '2026-10-19', done: true, order: 5 },
  ];
  const ids = () => sortSteps(st.filter(s => !s.done)).map(s => s.id).join('');
  check('ステップは期限が近い順(同じ期限は並び順、期限なしは最後)', ids() === 'bdac', ids());
  check('同じ期限のステップは↑で入れ替えられる', moveStep(st, 'a', -1) && ids() === 'badc', ids());
  check('期限が違うステップとは入れ替えない', !moveStep(st, 'b', 1) && !moveStep(st, 'c', -1) && ids() === 'badc', ids());
  check('期限の表示(期限切れ・今日まで・あと○日)',
    dueText('2026-10-16', '2026-10-18') === '期限切れ(2日過ぎ)' && dueText('2026-10-18', '2026-10-18') === '今日まで' && dueText('2026-10-22', '2026-10-18') === 'あと4日');

  // お試しデータ
  const dm = buildDemo('2026-11-06');
  const counts = r => Object.values(dm.days).filter(x => x.result === r).length;
  check('お試しデータ:完了・フリーズ・途切れ・ジムの日・休んだ日・月またぎがある',
    counts('done') > 0 && counts('freeze') >= 3 && counts('broken') >= 1 && Object.values(dm.days).some(x => x.gym)
      && Object.values(dm.days).some(x => x.freezeBy === 'rest') && new Set(Object.keys(dm.days).map(monthOf)).size >= 2,
    `完了${counts('done')}・フリーズ${counts('freeze')}・途切れ${counts('broken')}`);

  const pass = results.filter(r => r.ok).length;
  document.getElementById('app').innerHTML = `
    <h1 class="test-title">ストリーク判定の確認</h1>
    <p class="test-sum ${pass === results.length ? 'pass' : 'fail'}">${results.length}件中 ${pass}件 合格</p>
    <div class="card list">${results.map(r => `
      <div class="test-item">
        <span class="${r.ok ? 'pass' : 'fail'}">${r.ok ? '✓' : '✗'}</span>
        <div>${esc(r.name)}${!r.ok && r.detail ? `<div class="muted small">${esc(r.detail)}</div>` : ''}</div>
      </div>`).join('')}</div>`;
  document.getElementById('tabbar').hidden = true;
  console.table(results);
}

if (params.has('test')) runTests();
else boot();
</script>
</body>
</html>
